function Joystick({small, onDir}){
  const ref = React.useRef(null);
  const [pos, setPos] = React.useState({x:0,y:0});
  const [dir, setDir] = React.useState("");
  const size = small ? 55 : 65;
  const maxR = small ? 30 : 35;

  const getDir = (x,y) => {
    const dist = Math.sqrt(x*x+y*y);
    if(dist < 8) return "";
    const angle = Math.atan2(y,x) * 180 / Math.PI;
    if(angle > -45 && angle <= 45)  return "DROITE ▶";
    if(angle > 45  && angle <= 135) return "BAS ▼";
    if(angle > 135 || angle <= -135)return "GAUCHE ◀";
    return "HAUT ▲";
  };

  const handleMove = (clientX, clientY) => {
    const rect = ref.current.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > maxR){ dx = dx/dist*maxR; dy = dy/dist*maxR; }
    setPos({x:dx,y:dy});
    const d = getDir(dx,dy);
    setDir(d);
    if(onDir) onDir(d);
    if(navigator.vibrate && d) navigator.vibrate(20);
  };

  const reset = () => { setPos({x:0,y:0}); setDir(""); if(onDir) onDir(""); };

  const onTouchStart = e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); };
  const onTouchMove  = e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); };
  const onMouseDown  = e => { handleMove(e.clientX, e.clientY); };
  const onMouseMove  = e => { if(e.buttons===1) handleMove(e.clientX, e.clientY); };

  const outerSize = small ? 110 : 130;
  const innerSize = small ? 44 : 52;

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:small?3:5}}>
      {!small && <div className="joy-label">// Déplacement</div>}
      <div
        ref={ref}
        style={{width:outerSize,height:outerSize,borderRadius:"50%",background:"var(--panel2)",border:"2px solid var(--border)",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"none",userSelect:"none",boxShadow:"0 0 20px rgba(0,212,255,0.08)"}}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={reset}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={reset} onMouseLeave={reset}
      >
        <div style={{position:"absolute",width:outerSize*.6,height:outerSize*.6,borderRadius:"50%",border:"1px solid var(--border)",opacity:.4}}/>
        <div style={{position:"absolute",width:"100%",height:"1px",background:"rgba(0,212,255,.08)"}}/>
        <div style={{position:"absolute",width:"1px",height:"100%",background:"rgba(0,212,255,.08)"}}/>
        <div style={{
          width:innerSize,height:innerSize,borderRadius:"50%",
          background:"var(--panel)",
          border:"2px solid "+(pos.x===0&&pos.y===0?"var(--border)":"var(--accent)"),
          position:"absolute",
          display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:small?16:20,
          boxShadow:pos.x===0&&pos.y===0?"none":"0 0 14px rgba(0,212,255,0.4)",
          transform:"translate("+pos.x+"px,"+pos.y+"px)",
          transition:pos.x===0&&pos.y===0?"transform .2s":"none",
          pointerEvents:"none"
        }}>🕹️</div>
      </div>
      {!small && <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--accent)",height:14,textAlign:"center",letterSpacing:1}}>{dir}</div>}
    </div>
  );
}

  const [alerts,setAlerts]=useState(ALERTS_I);
  const [live,setLive]=useState(true);
  const [nav,setNav]=useState("control");
  const [time,setTime]=useState("");
  const [ls,setLs]=useState(false);

  useEffect(()=>{
    const t=()=>setTime(new Date().toTimeString().slice(0,8));
    t();const id=setInterval(t,1000);return()=>clearInterval(id);
  },[]);
  useEffect(()=>{
    if(charging&&battery<100){const id=setInterval(()=>setBattery(b=>Math.min(100,b+1)),1000);return()=>clearInterval(id);}
  },[charging,battery]);
  useEffect(()=>{
    if(ls){document.body.style.overflow='hidden';}else{document.body.style.overflow='';}
  },[ls]);

  const vib=()=>{if(navigator.vibrate)navigator.vibrate(30);};
  const bc=battery>50?"var(--green)":battery>20?"var(--orange)":"var(--red)";
  const dir=(d)=>{vib();setPressed(d);setTimeout(()=>setPressed(null),200);};

  // DpadGrid replaced by Joystick component

  if(ls)return(
    <div className="ls-overlay">
      <style>{css}</style>
      <div className="ls-topbar">
        <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--accent)",letterSpacing:3}}>GUARDIAN·X5</span>
        <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--text2)"}}>{time}</span>
        <button className="ls-close" onClick={()=>{vib();setLs(false);}}>✕ FERMER</button>
      </div>
      <div className="ls-body">
        <div className="ls-cam">
          <div className="ls-cam-inner">
            <CamContent live={live}/>
          </div>
        </div>
        <div className="ls-panel">
          <div className="ls-strow">
            <div className="ls-sbox"><span className="ls-sv" style={{color:bc}}>{battery}%</span><span className="ls-sl">Batterie</span></div>
            <div className="ls-sbox"><span className="ls-sv" style={{color:"var(--green)"}}>24ms</span><span className="ls-sl">Latence</span></div>
          </div>
          <div><div className="ls-label">// Mode</div>
            <div className="ls-modes">{MODES.map(m=>(
              <button key={m.id} className={"ls-mb"+(mode===m.id?" on":"")+(m.danger?" dng":"")} onClick={()=>{vib();setMode(m.id);}}>
                <span className="ic">{m.icon}</span>{m.label}
              </button>
            ))}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
            <div className="ls-label">// Déplacement</div>
            <Joystick small={true} onDir={(d)=>setPressed(d)}/>
          </div>
          <div><div className="ls-label">// Vitesse</div>
            <div className="ls-speed">{["LOW","MED","MAX"].map(s=>(
              <button key={s} className={"sbt"+(speed===s?" on":"")} onClick={()=>{vib();setSpeed(s);}}>{s}</button>
            ))}</div>
          </div>
          <div className="ls-batt">
            <div className="ls-bh">
              <span style={{fontSize:8,fontFamily:"var(--mono)",color:"var(--text2)"}}>{charging?"⚡ CHARGE":"🔋 BATT"}</span>
              <span style={{fontFamily:"var(--mono)",fontSize:14,fontWeight:700,color:bc}}>{battery}%</span>
            </div>
            <div className="bbar"><div className="bfill" style={{width:battery+"%",background:bc}}/></div>
            <div style={{fontSize:8,color:"var(--text2)",fontFamily:"var(--mono)",marginTop:3}}>{charging?"EN CHARGE...":battery<30?"⚠ FAIBLE":"~"+Math.round(battery*.9)+"MIN"}</div>
          </div>
          <div className="ls-acts">
            <button className="ls-abt" onClick={()=>{vib();setLive(v=>!v);}}>📷 {live?"Couper":"Activer"} cam</button>
            <button className="ls-tg" onClick={vib}>✈️ Telegram</button>
            <button className="ls-abt" onClick={()=>{vib();setCharging(true);setMode("dock");}}>⚡ Dock recharge</button>
            <button className="ls-abt stop" onClick={()=>{vib();setMode("stop");}}>🛑 ARRÊT URGENT</button>
          </div>
          {alerts.filter(a=>a.type==="danger").length>0&&(
            <div className="ls-alert-box">🚨 {alerts.filter(a=>a.type==="danger").length} ALERTE ACTIVE</div>
          )}
        </div>
      </div>
    </div>
  );

  return(
    <div className="app">
      <style>{css}</style>
      <div className="hdr">
        <div><div className="logo">GUARDIAN·X5<span className="logo-sub">SURVEILLANCE IA — RDK X5</span></div></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--text2)"}}>24ms</span>
          <span style={{display:"flex",alignItems:"center",fontSize:10,fontFamily:"var(--mono)"}}><span className="dot-on"/><span style={{color:"var(--green)"}}>EN LIGNE</span></span>
        </div>
      </div>

      <div className="cam-wrap">
        <div className="cam"><CamContent live={live}/></div>
        <button className="expand-btn" onClick={()=>{vib();setLs(true);}}>⛶ Paysage</button>
      </div>

      <div className="sbar">
        {[{v:battery+"%",l:"Batterie",c:bc},{v:mode==="patrol"?"ON":"OFF",l:"Patrouille",c:mode==="patrol"?"var(--green)":"var(--text2)"},{v:"24ms",l:"Latence",c:"var(--green)"},{v:alerts.filter(a=>a.type==="danger").length+"",l:"Alertes",c:alerts.filter(a=>a.type==="danger").length>0?"var(--red)":"var(--green)"}].map(s=>(
          <div className="si" key={s.l}><span className="sv" style={{color:s.c}}>{s.v}</span><span className="sl">{s.l}</span></div>
        ))}
      </div>

      <div className="section">
        <div className="slabel">// Mode opérationnel</div>
        <div className="mgrid">{MODES.map(m=>(
          <button key={m.id} className={"mbtn"+(mode===m.id?" on":"")+(m.danger?" dng":"")} onClick={()=>{vib();setMode(m.id);}}>
            <span className="ic">{m.icon}</span>{m.label}
          </button>
        ))}</div>
      </div>

      <div className="jsec">
        <div className="jwrap">
          <Joystick onDir={(d)=>setPressed(d)}/>
        </div>
        <div className="cright">
          <div className="cgrp">
            <div className="ct">// Vitesse</div>
            <div className="sbts">{["LOW","MED","MAX"].map(s=>(
              <button key={s} className={"sbt"+(speed===s?" on":"")} onClick={()=>{vib();setSpeed(s);}}>{s}</button>
            ))}</div>
          </div>
          <div className="cgrp">
            <div className="ct">// Actions</div>
            <div className="abts">
              <button className="abt" onClick={()=>{vib();setLive(v=>!v);}}>📷 {live?"Couper cam":"Activer cam"}</button>
              <button className="tgbt" onClick={vib}>✈️ Telegram</button>
              <button className="abt" onClick={()=>{vib();setCharging(true);setMode("dock");}}>⚡ Dock recharge</button>
              <button className="abt stop" onClick={()=>{vib();setMode("stop");}}>🛑 ARRÊT URGENT</button>
            </div>
          </div>
        </div>
      </div>

      <div className="bsec">
        <div className="bwrap">
          <span style={{fontSize:18}}>{charging?"⚡":"🔋"}</span>
          <div className="binfo">
            <span className="bpct" style={{color:bc}}>{battery}%</span>
            <div className="bbar"><div className="bfill" style={{width:battery+"%",background:bc}}/></div>
            <div className="bstatus">{charging?"EN CHARGE...":battery<30?"⚠ BATTERIE FAIBLE":"~"+Math.round(battery*.9)+"MIN"}</div>
          </div>
          <div className="bbts">
            <button className="bbt" onClick={()=>{vib();setCharging(v=>!v);}}>{charging?"⏹ Stop":"⚡ Charger"}</button>
            <button className="bbt" onClick={()=>{vib();setBattery(73);}}>⟳ Reset</button>
          </div>
        </div>
      </div>

      <div className="asec">
        <div className="ahdr">
          <span className="slabel">// Alertes récentes</span>
          <button className="clr" onClick={()=>{vib();setAlerts([]);}}>EFFACER</button>
        </div>
        <div className="alist">
          {alerts.length===0
            ?<div style={{textAlign:"center",color:"var(--text2)",fontFamily:"var(--mono)",fontSize:10,padding:"14px 0"}}>✅ AUCUNE ALERTE</div>
            :alerts.map(a=>(
            <div key={a.id} className={"ai "+a.type}>
              <span style={{fontSize:13}}>{a.icon}</span>
              <div style={{flex:1}}><div className="amsg">{a.msg}</div><div className="atm">IL Y A {a.time} MIN</div></div>
              <span className={"abg "+a.type}>{a.badge}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="bnav">
        {[{id:"control",icon:"🕹️",label:"Contrôle"},{id:"map",icon:"🗺️",label:"Carte"},{id:"ia",icon:"🤖",label:"IA"},{id:"settings",icon:"⚙️",label:"Config",n:1}].map(x=>(
          <button key={x.id} className={"nbt"+(nav===x.id?" on":"")} onClick={()=>{vib();setNav(x.id);}}>
            <div className="nwrap"><span className="nic">{x.icon}</span>{x.n&&<span className="nbdg">{x.n}</span>}</div>
            {x.label}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/guardian-x5/sw.js')
      .then(function(reg){ console.log('SW registered:', reg.scope); })
      .catch(function(err){ console.log('SW error:', err); });
  });
}
</script>
</body>
</html>
